name: Build Legado APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  # 1. 拉取源码
  - name: Checkout
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  # 2. 配置 JDK 17
  - name: Setup JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  # 3. 配置 Gradle
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  # 4. 配置 Android SDK
  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  # 5. 编译 Legado Release APK
  - name: Build APK
    run: |
      chmod +x ./gradlew
      ./gradlew :app:assembleAppRelease --no-daemon --stacktrace

  # 6. 查找生成的 APK
  - name: Find APK
    run: |
      echo "Generated APK files:"
      find app/build/outputs -type f -name "*.apk" -print

  # 7. 上传 APK 到 GitHub Actions
  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: legado-apk
      path: app/build/outputs/**/*.apk
      if-no-files-found: error
```
